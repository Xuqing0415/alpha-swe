name: chaos-stage

# 避免 push 频繁时旧 run 浪费 CI 分钟；
# schedule 触发时也会复用同一个 group，但极少与 push 同帧撞车，可接受。
concurrency:
  group: chaos-stage-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：当前 step 都不需要写
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00，每日跑一次混沌回归
    - cron: "0 18 * * *"
  push:
    branches: [master]
    paths:
      # 被测核心（chaos 实际演练的是 agent.core）
      - "agent/**"
      # 混沌/压测阶段自身用例
      - "tests/test_benchmark_suite.py"
      - "tests/test_fault_injection.py"
      - "tests/test_chaos_smoke.py"
      - "tests/test_real_project_e2e.py"
      - "tests/test_soak.py"
      - ".github/workflows/chaos.yml"
  pull_request:
    paths:
      - "agent/**"
      - "tests/test_benchmark_suite.py"
      - "tests/test_fault_injection.py"
      - "tests/test_chaos_smoke.py"
      - "tests/test_real_project_e2e.py"
      - "tests/test_soak.py"
      - ".github/workflows/chaos.yml"

jobs:
  chaos:
    name: Chaos / soak / benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # benchmark 套件含 js/ts 用例，verify 阶段会调用 `node --check`，
      # 显式安装 node 避免依赖镜像预装，保证跨 runner 行为一致。
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install pytest pytest-asyncio pytest-cov rich textual numpy \
            scikit-learn mcp jinja2 psutil

      - name: Chaos stage - benchmark + fault injection + random chaos + soak
        env:
          # 每次运行用新的随机种子（workflow run id），CI 加大规模
          CHAOS_SEED: ${{ github.run_id }}
          CHAOS_ITERATIONS: "24"
          CHAOS_INJECT_RATE: "0.6"
          CHAOS_LLM_FAIL_RATE: "0.2"
          SOAK_SESSIONS: "40"
        run: |
          python -X utf8 -m pytest \
            tests/test_benchmark_suite.py \
            tests/test_fault_injection.py \
            tests/test_chaos_smoke.py \
            tests/test_real_project_e2e.py \
            tests/test_soak.py \
            -q -p no:cacheprovider --durations=10
