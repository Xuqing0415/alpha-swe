name: benchmark-real-project

# L1-L4 真实项目基准复测（含 L3/L4）。
# - 配置了 DEEPSEEK_API_KEY secret 时：真实 LLM 全量复测（每天/每周）；
# - 未配置时：以 --skip-llm 阴性对照跑一遍（校验完成标准判定器本身无回归），
#   不消耗 LLM，也不把「预期失败」当工作流失败。
# 复测报告上传为 artifact（logs/real_project_report.json）。
on:
  workflow_dispatch:
  schedule:
    # UTC 周日 01:00 = 北京时间周日 09:00，每周一次真实复测
    - cron: "0 1 * * 0"

concurrency:
  group: benchmark-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Real-project L1-L4 rerun
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # if 条件里不能直接用 secrets 上下文，改用 job 级环境变量做开关
    env:
      HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install pytest pytest-asyncio rich textual numpy scikit-learn mcp jinja2 psutil

      - name: Full benchmark rerun (real LLM)
        if: env.HAS_DEEPSEEK_KEY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -X utf8 scripts/run_real_project_tasks.py \
            --timeout 1500 --max-cost 2.0 || true

      - name: Negative-control harness check (no LLM key)
        if: env.HAS_DEEPSEEK_KEY != 'true'
        run: |
          # 在 8 个干净副本上跑完成标准判定器（不消耗 LLM）：
          # - 判定器正常：全部判失败（passed=0）；
          # - 判定器回归：把缺陷项目判成通过（passed>0），CI 报错；
          # - 执行器崩溃：报告缺失或未跑满 8 个任务，CI 报错。
          set +e
          python -X utf8 scripts/run_real_project_tasks.py --skip-llm
          code=$?
          set -e
          echo "skip-llm exit=$code (预期非 0)"
          python -X utf8 - <<'PY'
          import json
          with open('logs/real_project_report.json', encoding='utf-8') as fh:
              report = json.load(fh)
          total, passed = report.get('total', -1), report.get('passed', -1)
          print('negative-control: total=%d passed=%d' % (total, passed))
          if passed != 0:
              raise SystemExit('阴性对照不应通过：干净副本被判为完成（判定器疑似回归）')
          if total != 8:
              raise SystemExit('阴性对照未完整执行：total=%d，预期 8' % total)
          PY
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-project-report
          path: logs/real_project_report.json
          if-no-files-found: warn
