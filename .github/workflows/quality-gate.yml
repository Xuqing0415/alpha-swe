name: quality-gate

# 同一个 ref 上多个 push/PR 时，旧 run 直接取消，省 CI
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：lint/test/build 都不需要写仓库
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "agent/**"
      - "server/**"
      - "swe_eval/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docker/**"
      - "requirements-server.txt"
      - ".flake8"
      - ".dockerignore"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "agent/**"
      - "server/**"
      - "swe_eval/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docker/**"
      - "requirements-server.txt"
      - ".flake8"
      - ".dockerignore"
      - ".github/workflows/quality-gate.yml"

jobs:
  lint:
    name: flake8 lint gate (F/B/C4/E9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 flake8-bugbear flake8-comprehensions

      - name: flake8 gate
        run: |
          flake8 agent/ swe_eval/ server/ scripts/ tests/ --jobs=1

  test:
    name: pytest unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install pytest pytest-asyncio pytest-cov rich textual numpy \
            scikit-learn mcp jinja2

      # 与本地 scripts/run_tests.sh 的离线集合保持一致：
      # 排除需要 Docker daemon / npm 编译 / SWE-bench 数据集下载的用例，
      # 以及重型的混沌与压测阶段（混沌阶段由 chaos.yml 负责）。
      - name: Run offline tests
        run: |
          python -X utf8 -m pytest -q -p no:cacheprovider --durations=10 \
            --ignore=tests/test_chaos_smoke.py \
            --ignore=tests/test_fault_injection.py \
            --ignore=tests/test_benchmark_suite.py \
            --ignore=tests/test_real_project_e2e.py \
            --ignore=tests/test_soak.py \
            --ignore=tests/test_docker_real.py \
            --ignore=tests/test_mcp_ts_servers.py \
            --ignore=tests/test_swebench_dataset.py \
            --ignore=tests/test_swebench_evaluate.py

  build:
    name: docker image build (build verification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          load: true
          tags: alphaswe/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - /healthz returns 200
        run: |
          docker run -d --name aswe -p 8000:8000 \
            -e ASWE_ADMIN_API_KEY=ci-smoke-key alphaswe/server:ci
          ok=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo "healthz OK"; ok=1; break
            fi
            sleep 3
          done
          docker logs aswe || true
          docker rm -f aswe || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::服务启动后 /healthz 未返回 200"; exit 1
          fi
