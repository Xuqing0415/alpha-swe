name: deploy

# 部署需要写包（GHCR）与读仓库
permissions:
  contents: read
  packages: write

on:
  # quality-gate 在 master 上跑绿后自动触发部署（保证先测后发）
  workflow_run:
    workflows: ["quality-gate"]
    types: [completed]
    branches: [master]
  # 打 tag 直接发布（vX.Y.Z / vX.Y.Z-rc.N）
  push:
    tags: ["v*"]

jobs:
  publish:
    name: build & push to GHCR
    # workflow_run 路径：仅当质量门通过才发布；tag 路径：直接发布
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时检出对应提交 SHA，避免拿到错误的 ref
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 仓库名必须小写
      - name: Compute image name
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # master 上发布 latest；tag 发布时也带 latest
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.event_name == 'workflow_run' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ steps.img.outputs.name }}@${{ steps.meta.outputs.tags }}"
