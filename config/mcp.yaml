# MCP 服务器清单（对应设计第 13 节）
# transport: stdio（本地命令）或 sse（远程 URL）
mcp_servers:
  # github：需要外网与 GITHUB_TOKEN，未配置时启动会连接失败并产生报错噪音。
  # 需要时取消注释，并设置 GITHUB_TOKEN 环境变量。
  # - name: "github"
  #   transport: "stdio"
  #   command: "npx"
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   env: {}
  # custom-knowledge：SSE 传输示例，需先启动 http://localhost:8000/sse 服务；
  # 未启动时连接失败（All connection attempts failed），需要时取消注释。
  # - name: "custom-knowledge"
  #   transport: "sse"
  #   url: "http://localhost:8000/sse"
  # ---- 自研 TypeScript MCP 服务器（mcp-servers/，需先 npm install && npm run build）----
  - name: "knowledge-base"
    transport: "stdio"
    command: "node"
    args: ["mcp-servers/knowledge-base/dist/index.js"]
    env: {}
  - name: "issue-tracker"
    transport: "stdio"
    command: "node"
    args: ["mcp-servers/issue-tracker/dist/index.js"]
    env: {}
