# 基线配置 —— 配置→运行时数据流演示（config/default.yaml）
# 对应设计：配置(Pydantic) → 组件工厂 → 运行时决策点注入
llm:
  provider: openai
  model: gpt-4o
  temperature: 0.2
  max_tokens: 4096

sandbox:
  workspace: "./workspace"
  network_enabled: false      # 默认禁止出站网络
  read_only_root: true
  memory_limit: "2g"
  cpu_limit: 2.0
  timeout_seconds: 300
  # 网络细粒度策略（本地工具层）：deny | allowlist | allow
  network_policy: deny
  network_allowed_commands:
    - "pip install"
    - "pip3 install"
    - "pip download"
    - "apt-get"
    - "npm install"
    - "pnpm install"
  fake_network: false          # 假网络：curl/wget 返回预设响应（不产生真实请求）
  fake_network_responses: {}   # URL 前缀 -> 响应体
  # 文件保护：删除/写入这些路径需要拦截或确认
  protected_paths:
    - ".git"
    - "config/agent.yaml"
    - "config/mcp.yaml"
    - "config/team.yaml"
    - "*.lock"
    - "package-lock.json"
  audit_dir: "./logs/audit"    # 文件操作审计（before/after diff，支持回滚）
  # 资源监控与熔断（psutil）：命令内存超限自动 kill
  resource_monitor: false
  memory_limit_mb: 512
  poll_interval: 0.2

context:
  max_tokens: 8000
  compression_threshold: 0.8
  compression_method: summary
  compression_safety_margin: 1.15  # 估算 token 安全边际（触发/分级用 估算值×系数，防低估）

memory:
  backend: hybrid             # none | sqlite | hybrid | chroma | qdrant
  db_path: "memory.db"
  collection_name: "swe-agent-memory"
  embedding_model: "all-MiniLM-L6-v2"
  top_k_retrieval: 5
  similarity_threshold: 0.0   # 0 = 不过滤

planner:
  max_subtasks: 5
  allow_parallel: true
  split_threshold_complexity: 0.4

agent:
  max_loop_iterations: 20
  parallel_tool_calls: true
  require_confirmation:
    - file_write
    - terminal:rm
    - terminal:git push
  auto_approve:
    - file_read
    - terminal:ls
    - terminal:cat

mcp_servers: []
active_plugins: []
active_skills: []
decision_log_path: "decision_log.jsonl"