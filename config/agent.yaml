# Alpha-SWE Agent 配置（对应设计第 15 节：YAML + Pydantic）
agent:
  max_rounds: 30            # 单任务最大 ReAct 轮数
  max_retries: 3            # 输出解析失败最大重试次数
  token_threshold: 0.8      # 上下文压缩触发阈值
  max_token_limit: 100000
  keep_recent_rounds: 3     # 压缩时保留的最近轮数
  max_concurrency: 1        # 并发子任务数（工具资源允许时提高）
  trace_dir: "./logs/traces"
  trace_enabled: true
  session_archive_dir: "./logs/sessions"  # 会话档案（回放用）
  archive_enabled: true
  metrics_enabled: true
  # 主线一 1.1/1.2：项目状态感知与会话间工作流连续性（.swe-agent/）
  state_tracker_enabled: true
  workspace_context_enabled: true

tools:
  terminal_execute:
    enabled: true
    timeout: 30
  file_ops:
    enabled: true
  file_search:
    enabled: true

sandbox:
  workspace: "./workspace"
  allowed_paths: []          # 留空 = 工作区内任意路径
  blocked_paths:
    - "/etc"
    - "/sys"
    - "/proc"
    - "/boot"
    - "/root"
    - "C:\\Windows"
    - "C:\\Windows\\System32"
  block_commands:
    - "sudo"
    - "rm -rf /"
    - "mkfs"
    - "dd if="
  # Docker 沙箱（docker-py）已启用；需本机 Docker daemon 可用，且镜像 alphaswe/dev:latest 已存在
  docker_enabled: true
  image: "alphaswe/dev:latest"
  read_only: false
  no_network: true
  # 网络细粒度策略（本地工具层）：deny | allowlist | allow
  network_policy: deny
  network_allowed_commands:
    - "pip install"
    - "pip3 install"
    - "pip download"
    - "apt-get"
    - "apt "
    - "npm install"
    - "pnpm install"
  fake_network: false              # 假网络：curl/wget 返回预设响应（不产生真实请求）
  fake_network_responses: {}       # URL 前缀 -> 响应体
  # 文件保护：删除/写入这些路径需要拦截或确认
  protected_paths:
    - ".git"
    - "config/agent.yaml"
    - "config/mcp.yaml"
    - "config/team.yaml"
    - "*.lock"
    - "package-lock.json"
  audit_dir: "./logs/audit"        # 文件操作审计（before/after diff，支持回滚）
  # 资源监控与熔断（psutil）：命令内存超限自动 kill
  resource_monitor: false
  memory_limit_mb: 512
  poll_interval: 0.2
  # Docker 容器生命周期（docker_enabled=True 时由 DockerSandbox 使用）
  workdir: "/workspace"          # 容器内工作目录（卷挂载目标）
  volume_mode: "rw"              # 工作区卷挂载模式（rw / ro）
  snapshot_prefix: "alphaswe/snap"  # docker commit 快照镜像前缀
  auto_rollback: true            # 任务失败时自动回滚到任务前快照

memory:
  # 出厂默认 offline-safe：本地 SQLite + TF-IDF，零外部依赖，长期记忆持久有效。
  # 需要向量检索时改回 chroma + sentence-transformers，并先运行
  # scripts/download_embedding_model.py 下载本地模型，避免维度不匹配触发重建清空。
  backend: hybrid             # auto | sqlite | hybrid | chroma | qdrant
  db_path: "memory.db"
  max_entities: 1000
  top_k: 5
  collection: "alpha_swe_memories"
  embedder: tfidf             # auto | tfidf | sentence-transformers | openai
  embedding_model: "all-MiniLM-L6-v2"  # 例如 all-MiniLM-L6-v2 / text-embedding-3-small
  embedding_model_path: "models/sentence-transformers/all-MiniLM-L6-v2"  # 本地模型目录（相对项目根，离线加载，优先于 embedding_model）
  embedding_offline: true   # 离线：禁止 HuggingFace 联网下载，规避 SSL/httpx 错误
  embedding_base_url: ""
  embedding_api_key_env: "OPENAI_API_KEY"
  hybrid_weight_vector: 0.6  # 向量 vs 关键词 混合权重
  max_code_index_chars: 2000
  auto_experience: true      # 任务完成后自动生成经验摘要

llm:
  provider: litellm          # mock | litellm
  model: deepseek/deepseek-chat  # 带 provider 前缀，litellm 才能识别为 deepseek；推理模型用 deepseek/deepseek-reasoner
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"   # 运行前先 set DEEPSEEK_API_KEY=sk-...（不落盘）
  temperature: 0.2
  max_tokens: 2048
mcp:
  enabled: true            # 启动时连接 config/mcp.yaml 中的服务器
  connect_timeout: 8.0     # 单服务器握手超时
  tool_timeout: 30.0       # 工具调用超时
  max_resources_per_run: 3 # 每次运行最多注入的资源数

# 插件动态注入（对应设计第 10 节）
plugin:
  enabled: true
  dir: "./plugins"              # 插件目录（Markdown + YAML front-matter，热加载）
  max_active: 5                 # 单次最多激活插件数（按 priority 截断）

# 技能工作流（对应设计第 10.2 节）
skills:
  enabled: true
  dir: "./skills/workflows"     # YAML 技能库目录（热加载）
  workflow_enabled: true        # 技能命中时展开为子任务 DAG，替代 LLM 规划
  max_active: 3                 # 单次最多激活技能数
  allow_fallback: true          # 步骤失败允许按 fallback 回退重试
  registry_file: "./skills/skill_manifest.json"  # 技能注册表（requires/permissions/params）
  usage_log: "./logs/skill_usage.jsonl"          # 技能使用/成败历史（版本管理）
  require_task_intent: true                      # 工作流激活需任务意图命中，避免误触发
